# Test → Build → Push for fake-auth. Single workflow only.
# PR (non-draft): after ECR push → optional `bump-prod-lock` on radimal-deploy. **No auto-bump on merge to main/master.**
# main/master: test → push ECR only (tags: branch name + sha).
# Set secret RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN to enable bump dispatch (unset → skip).
name: Test, Build and Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: test
        run: go test -tags=integration ./...

  build-and-push-pr:
    name: PR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: buildx
        uses: docker/setup-buildx-action@v3

      - name: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/fake-auth:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1

  build-and-push-master:
    name: push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: buildx
        uses: docker/setup-buildx-action@v3

      - name: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/fake-auth:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/fake-auth:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1

  bump-prod-lock:
    runs-on: ubuntu-latest
    needs: build-and-push-pr
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    env:
      RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN: ${{ secrets.RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN }}
    permissions:
      contents: read
    steps:
      - name: dispatch
        if: env.RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN }}
          repository: Radimal/radimal-deploy
          event-type: bump-prod-lock
          client-payload: |
            {
              "lock_key": "fake-auth",
              "image_tag": "sha-${{ github.event.pull_request.head.sha }}",
              "source_repository": "${{ github.repository }}",
              "commit_sha": "${{ github.event.pull_request.head.sha }}",
              "pr_number": "${{ github.event.pull_request.number }}"
            }
