# PRs: Go tests. Push to master: ECR + prod-lock bump (digest required). Replaces Docker Hub publish.
name: Test, Build and Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        run: go test -tags=integration ./...

  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/fake-auth:master
            ${{ steps.login-ecr.outputs.registry }}/fake-auth:sha-${{ github.sha }}
          cache-from: type=gha,scope=fake-auth
          cache-to: type=gha,mode=max,scope=fake-auth
        env:
          DOCKER_BUILDKIT: 1

  bump-prod-lock:
    name: Request prod-lock bump PR (radimal-deploy)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Dispatch bump-prod-lock
        env:
          TOKEN: ${{ secrets.RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN }}
          TAG: sha-${{ github.sha }}
          SRC_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RADIMAL_DEPLOY_REPO_DISPATCH_TOKEN not set; skipping bump-prod-lock dispatch"
            exit 0
          fi
          if [ -z "${DIGEST:-}" ]; then
            echo "::error::ECR image digest missing from build; refusing bump without digest"
            exit 1
          fi
          body="$(jq -nc \
            --arg tag "$TAG" \
            --arg sr "$SRC_REPO" \
            --arg cs "$COMMIT_SHA" \
            --arg dig "$DIGEST" \
            '{event_type: "bump-prod-lock", client_payload: {lock_key: "fake-auth", image_tag: $tag, source_repository: $sr, commit_sha: $cs, image_digest: $dig}}')"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Radimal/radimal-deploy/dispatches \
            -d "$body"
