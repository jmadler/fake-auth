# Local prod-like stack: auth2 + Postgres + Redis
# Run: docker compose -f deploy/docker-compose.yml up -d

services:
  auth2:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9092:9092"
    environment:
      PORT: "9092"
      DB_DRIVER: postgres
      DB_DSN: postgres://auth2:auth2@postgres:5432/auth2?sslmode=disable
      GRANT_STORE: redis
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379
      ISSUER_URL: http://localhost:9092
      CLIENT_REGISTRY: '{}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth2-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth2
      POSTGRES_PASSWORD: auth2
      POSTGRES_DB: auth2
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - auth2-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth2 -d auth2"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - auth2-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  auth2-net:
    driver: bridge
